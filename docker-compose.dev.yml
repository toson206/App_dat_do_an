services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dx-order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dx_order}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dx_order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dx_order}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - dx-order-network

  # 2. pgAdmin 4 (Database Management Web UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dx-order-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dxtech.asia}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - dx_order_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dx-order-network

  # 3. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dx-order-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dx_order}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      PORT: ${BACKEND_PORT:-8000}
      HOST: ${BACKEND_HOST:-0.0.0.0}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dx-order-network

volumes:
  dx_order_postgres_data:
  dx_order_pgadmin_data:

networks:
  dx-order-network:
    driver: bridge
